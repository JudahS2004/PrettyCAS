<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrettyCAS</title>
  <script src="./theme-init.js"></script>
  <link rel="stylesheet" href="./node_modules/mathlive/mathlive-static.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <canvas id="bg-fx-canvas" class="bg-fx-canvas" aria-hidden="true"></canvas>
  <div class="bg-fx-pulse" aria-hidden="true">
    <span class="pulse-orb pulse-orb-1"></span>
    <span class="pulse-orb pulse-orb-2"></span>
    <span class="pulse-orb pulse-orb-3"></span>
  </div>

  <header class="topbar">
    <h1 id="app-title" title="Click to toggle debug mode">PrettyCAS</h1>
    <nav class="pages">
      <a href="./index.html" aria-current="page">Compute</a>
      <a href="./plot.html">Plot</a>
      <a href="./help.html">Help</a>
    </nav>
    <div class="menu-wrap">
      <button id="misc-menu-toggle" class="icon-button" title="More" aria-label="More">&#9776;</button>
      <div id="misc-menu" class="misc-menu" hidden>
        <a href="./misc.html">Misc</a>
      </div>
    </div>
    <button id="settings-toggle" class="icon-button" title="Settings" aria-label="Settings">&#9881;</button>
  </header>

  <main>
    <div class="panel">
      <math-field id="mf" style="display: block; width: 100%;"></math-field>
      <div class="row quick-toggles">
        <button type="button" class="cycle-toggle" id="angle-toggle" title="Click to change angle mode"></button>
        <button type="button" class="cycle-toggle" id="number-toggle" title="Click to change number format"></button>
        <button type="button" class="cycle-toggle" id="simplify-toggle" title="Click to change result form"></button>
        <button id="copy-input" class="copy-btn" title="Copy input">Copy</button>
      </div>
    </div>

    <div id="output-panel" class="panel output-panel" data-mode="idle">
      <h2 class="output-panel-title">Output</h2>
      <div class="output-panel-header">
        <div id="output-badges" class="badges"></div>
        <button id="copy-output" class="copy-btn" title="Copy output">Copy</button>
      </div>
      <div id="output-render" class="output-render">
        <span class="placeholder">Result will show up here.</span>
      </div>
    </div>

    <details class="history" id="workspace">
      <summary>Workspace</summary>
      <div class="history-header">
        <button type="button" id="clear-workspace" class="copy-btn">Clear</button>
      </div>
      <div class="workspace-list"></div>
    </details>

    <details class="history" id="history">
      <summary>History</summary>
      <div class="history-header">
        <button type="button" id="clear-history" class="copy-btn">Clear</button>
      </div>
      <div class="history-list"></div>
    </details>
  </main>

  <div id="settings-backdrop" class="settings-backdrop">
    <aside class="settings-panel">
      <h2>Settings</h2>
      <div id="settings-body"></div>
    </aside>
  </div>

  <script type="module" src="./app.js"></script>
  <script type="module" src="./background-fx.js"></script>
</body>
</html>
